name: Ping An Good Doctor
description: 'Ping An Good Doctor (Ping An Healthcare and Technology Company Limited, since rebranded
  Ping An Health, HKEX: 1833) is the online-healthcare arm of China''s Ping An Insurance Group and one
  of the country''s largest one-stop online healthcare platforms. Through its consumer app it offers
  online medical consultations delivered by an in-house medical team and AI triage, family-doctor
  memberships, a health mall for pharmaceutical and wellness e-commerce, and health-management and
  chronic-disease services. The platform serves individual consumers as well as enterprise and financial
  channels across China. As surfaced to the API Evangelist network it is a consumer/enterprise app
  business with no public developer API program: enrichment found no developer portal, OpenAPI, SDKs, or
  open-platform documentation, and the historical corporate domain (pahtg.com) now resolves to a parked
  landing page.'
